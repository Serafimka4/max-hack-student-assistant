name: max-hack

x-app: &app
  build:
    context: ./platform
  image: max-hack-platform:local
  env_file:
    - path: .env
      required: false
  environment: &app-env
    # По умолчанию — демонстрационный режим: демо-данные и вход демо-студентом. Для рабочего сервера: APP_ENV=production.
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:8088}
    APP_KEY: ${APP_KEY:-}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-max_hack}
    DB_USERNAME: ${DB_USERNAME:-max_hack}
    DB_PASSWORD: ${DB_PASSWORD:-max_hack}
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    MINIAPP_TIMEZONE: ${MINIAPP_TIMEZONE:-Europe/Saratov}
    MINIAPP_SEMESTER_START: ${MINIAPP_SEMESTER_START:-2026-09-01}
    MINIAPP_ENROLL_ORGANIZATION: ${MINIAPP_ENROLL_ORGANIZATION:-demo-university}
    MINIAPP_DEMO_DATA: ${MINIAPP_DEMO_DATA:-true}
    MINIAPP_DEMO_LOGIN: ${MINIAPP_DEMO_LOGIN:-true}
    SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
    SESSION_PARTITIONED_COOKIE: ${SESSION_PARTITIONED_COOKIE:-false}
  volumes:
    - storage:/app/storage/app
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
      SEED_DEMO: ${SEED_DEMO:-1}
    ports:
      - "${APP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-max_hack}
      POSTGRES_USER: ${DB_USERNAME:-max_hack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-max_hack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  storage:
